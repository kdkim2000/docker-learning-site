name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 또는 기본 브랜치 이름 (예: master)
  workflow_dispatch:  # 수동 실행 가능

# GitHub Pages에 배포할 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        env:
          # GitHub Pages에서 repository 이름을 base URL로 사용하려면 아래 주석을 해제하고
          # repository 이름에 맞게 수정하세요 (예: '/docker-learning-site/')
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run generate

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

